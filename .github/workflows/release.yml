name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Determine version and create release
    runs-on: ubuntu-latest
    steps:
      # RELEASE_PAT is used instead of the default GITHUB_TOKEN so that the
      # version-bump commit can push directly to main. Our branch ruleset
      # allows admins to bypass required status checks, and the PAT
      # authenticates as an admin user — the default GITHUB_TOKEN cannot.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Determine version bump
        id: bump
        run: node scripts/determine-bump.cjs

      - name: Update package.json version
        run: npm version ${{ steps.bump.outputs.new_version }} --no-git-tag-version

      - name: Generate changelog
        run: node scripts/generate-changelog.cjs > CHANGELOG_RELEASE.md

      - name: Build package
        run: mkdir -p dist && npm pack --pack-destination dist

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release ${{ steps.bump.outputs.new_version }}"
          git push

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh release create "v${{ steps.bump.outputs.new_version }}" \
            --title "v${{ steps.bump.outputs.new_version }}" \
            --notes-file CHANGELOG_RELEASE.md \
            dist/*.tgz

      - name: Post release comments and close resolved issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/post-release-comments.cjs ${{ steps.bump.outputs.new_version }}
