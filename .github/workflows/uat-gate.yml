name: UAT Gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  uat-gate:
    name: UAT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check UAT completion
        run: |
          # Find HUMAN-UAT files in .planning/phases/
          UAT_FILES=$(find .planning/phases -name "*-HUMAN-UAT.md" -type f 2>/dev/null)

          if [ -z "$UAT_FILES" ]; then
            echo "No HUMAN-UAT files found in .planning/phases/"
            echo "Complete human UAT with /gsd:verify-work before merging."
            exit 1
          fi

          ALL_COMPLETE=true
          for f in $UAT_FILES; do
            STATUS=$(head -10 "$f" | grep '^status:' | awk '{print $2}')
            echo "Found: $f — status: $STATUS"
            if [ "$STATUS" != "complete" ]; then
              ALL_COMPLETE=false
            fi
          done

          if [ "$ALL_COMPLETE" = true ]; then
            echo "All HUMAN-UAT files have status: complete"
          else
            echo ""
            echo "Not all HUMAN-UAT sessions are complete."
            echo "Finish UAT with /gsd:verify-work before merging."
            exit 1
          fi
